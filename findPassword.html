<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码</title>
    <link rel="stylesheet" href="../iconfont/iconfont.css">
    <link rel="stylesheet" href="../css/findPassword.css">
    <link rel="stylesheet" href="../css/modal.css">
</head>
<body>
    <div class="title">
        <a href="./submission.html" class="iconfont icon-fanhui"></a>
        <em>找回密码</em>
    </div>

    <form id="findForm">
        <div class="form_item">
            <label for="phone">　手机号：</label>
            <input type="text" placeholder="请输入您的手机号" id="phone">
        </div>

        <div class="form_item">
            <label for="code">　验证码：</label>
            <div class="code_wrap">
                <input type="text" placeholder="请输入验证码" id="code">
                <button type="button" id="getCode">获取验证码</button>
            </div>
        </div>

        <div class="form_item">
            <label for="password">　新密码：</label>
            <input type="password" placeholder="请输入您的密码" id="password">
        </div>

        <div class="form_item">
            <label for="confirm">确认密码：</label>
            <input type="password" placeholder="请再次输入密码" id="confirm">
        </div>
        <button class="submission">确定</button>
    </form>
    <script src="../js/findPassword.js"></script>
    <script src="../js/modal.js"></script>
</body>
</html>
