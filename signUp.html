<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link rel="stylesheet" href="../iconfont/iconfont.css">
    <link rel="stylesheet" href="../css/signUp.css">
    <link rel="stylesheet" href="../css/modal.css">
</head>
<body>
    <div class="title">
    <a href="./submission.html" class="iconfont icon-fanhui"></a>
    <em>登录/注册</em>
    </div>
    <form id="loginForm">
        <div class="form_item">
            <label for="pic">　　头像：</label>
            <img id="pic" src="../img/image.png" >
        </div>
        <div class="form_item">
            <label for="phone">　手机号：</label>
            <input type="text" placeholder="请输入您的手机号" id="phone">
        </div>
        <div class="form_item">
            <label for="password">　　密码：</label>
            <input type="password" placeholder="请输入您的密码" id="password">
        </div>
        <div class="form_item">
            <label for="confirm">确认密码：</label>
            <input type="password" placeholder="请再次输入密码" id="confirm">
        </div>
    <button class="button">注册</button>
    </form>
    <script src="../js/signUp.js"></script>
    <script src="../js/modal.js"></script>
</body>
</html>
